<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Traje azul -->
  <path d="M 15 100 C 15 65, 85 65, 85 100" fill="#38BDF8" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Camisa -->
  <path d="M 35 70 L 50 90 L 65 70 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Corbata roja -->
  <path d="M 45 84 L 55 84 L 52 100 L 48 100 Z" fill="#EF4444" stroke="#0F172A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Orejas (puestas debajo para que la cabeza las pise) -->
  <circle cx="20" cy="50" r="7" fill="#FFC299" stroke="#0F172A" stroke-width="5" />
  <circle cx="80" cy="50" r="7" fill="#FFC299" stroke="#0F172A" stroke-width="5" />
  
  <!-- Cabeza (Redondeada y gruesa, tapa los bordes internos de las orejas) -->
  <rect x="20" y="15" width="60" height="60" rx="25" fill="#FFC299" stroke="#0F172A" stroke-width="5" />
  
  <!-- Pelo (Peinado formal de oficinista) -->
  <path d="M 18 35 C 15 5, 85 5, 82 35 C 82 20, 60 12, 50 18 C 35 25, 18 35, 18 35 Z" fill="#0F172A" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Gafas gruesas de pasta -->
  <rect x="26" y="40" width="20" height="16" rx="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" />
  <rect x="54" y="40" width="20" height="16" rx="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" />
  
  <!-- Puente de las gafas -->
  <line x1="46" y1="48" x2="54" y2="48" stroke="#0F172A" stroke-width="5" stroke-linecap="round" />
  
  <!-- Ojos (Puntos grandes negros alineados a las gafas) -->
  <circle cx="36" cy="48" r="3.5" fill="#0F172A" />
  <circle cx="64" cy="48" r="3.5" fill="#0F172A" />
  
  <!-- Cejas (Ligeramente asimétricas para darle personalidad) -->
  <path d="M 28 32 Q 36 28 42 34" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round" />
  <path d="M 72 32 Q 64 28 58 34" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round" />
  
  <!-- Boca (Media sonrisa ladeada y segura) -->
  <path d="M 44 64 Q 50 68 56 62" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />
</svg>