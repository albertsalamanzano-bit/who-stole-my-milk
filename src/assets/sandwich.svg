<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  
  <!-- Sombra base suave -->
  <ellipse cx="46" cy="86" rx="34" ry="6" fill="#0F172A" opacity="0.18" />

  <!-- 1. Rebanada de pan inferior (Corteza dorada) -->
  <path d="M 14 66 L 14 74 C 14 81, 28 85, 48 85 C 66 85, 76 81, 78 74 L 76 64 Z" fill="#D97706" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- 2. Lechuga rizada (Olas verdes vibrantes) -->
  <path d="M 9 64 C 6 58, 14 52, 21 57 C 26 51, 36 51, 41 57 C 47 51, 58 51, 63 57 C 69 52, 79 55, 79 62 C 81 68, 72 72, 65 68 C 58 74, 46 74, 40 68 C 32 74, 20 74, 16 68 C 10 70, 8 67, 9 64 Z" fill="#4ADE80" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- 3. Rodaja de tomate / jamón -->
  <path d="M 16 55 C 16 63, 36 66, 54 63 C 66 62, 73 59, 73 53 L 16 50 Z" fill="#EF4444" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- 4. Queso Cheddar derretido (Punta colgando delante) -->
  <path d="M 14 47 L 30 66 L 46 52 L 72 53 L 70 45 Z" fill="#FACC15" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- 5. Grosor de la corteza superior -->
  <path d="M 12 36 L 12 46 C 12 53, 36 59, 74 52 L 74 45 C 36 52, 12 45, 12 36 Z" fill="#D97706" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- 6. Rebanada de pan superior CON MORDISCO (3 arcos hacia dentro a la derecha) -->
  <path d="M 12 36 C 12 21, 28 16, 50 16 C 60 16, 68 18, 73 22 Q 60 23 63 31 Q 53 36 65 41 Q 63 46 74 46 C 58 52, 34 52, 18 45 C 13 43, 12 39, 12 36 Z" fill="#FEF3C7" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- Detalles de tostado en el pan superior -->
  <path d="M 24 28 Q 30 25 36 28" fill="none" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />
  <path d="M 28 36 Q 36 33 44 36" fill="none" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />

  <!-- 7. Palillo y aceituna pinchada arriba -->
  <ellipse cx="42" cy="31" rx="4" ry="2" fill="#0F172A" />
  <line x1="42" y1="31" x2="34" y2="6" stroke="#0F172A" stroke-width="5" stroke-linecap="round" />
  <ellipse cx="37" cy="16" rx="9" ry="7" transform="rotate(-15 37 16)" fill="#84CC16" stroke="#0F172A" stroke-width="4.5" />
  <circle cx="40" cy="15" r="2.5" fill="#EF4444" />

  <!-- 8. Migas del mordisco flotando a la derecha -->
  <circle cx="84" cy="28" r="3.5" fill="#FEF3C7" stroke="#0F172A" stroke-width="3.5" />
  <circle cx="91" cy="39" r="2.5" fill="#D97706" stroke="#0F172A" stroke-width="3" />
  <circle cx="83" cy="48" r="2.5" fill="#FACC15" stroke="#0F172A" stroke-width="3" />

</svg>
