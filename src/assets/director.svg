<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  
  <!-- Ropa: Traje gris carbón (Pinstripe Suit) -->
  <path d="M 15 100 C 15 60, 85 60, 85 100" fill="#334155" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Ropa: Camisa blanca (Escote V) -->
  <path d="M 35 65 L 50 90 L 65 65 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Solapas del traje (Lapels) -->
  <path d="M 35 65 L 25 100" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
  <path d="M 65 65 L 75 100" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
  
  <!-- Cuello de la camisa -->
  <path d="M 35 65 L 50 76 L 65 65" fill="none" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- Ropa: Corbata Roja (Power Tie) - Nudo y caída -->
  <path d="M 46 76 L 54 76 L 51 100 L 49 100 Z" fill="#DC2626" stroke="#0F172A" stroke-width="4" stroke-linejoin="round" />
  <path d="M 45 76 L 55 76 L 53 84 L 47 84 Z" fill="#DC2626" stroke="#0F172A" stroke-width="4" stroke-linejoin="round" />

  <!-- Pañuelo de bolsillo (Pocket Square) -->
  <path d="M 23 72 L 29 72 L 26 64 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" stroke-linejoin="round" />
  <line x1="21" y1="72" x2="31" y2="72" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />

  <!-- Orejas -->
  <circle cx="20" cy="50" r="7" fill="#FFC299" stroke="#0F172A" stroke-width="5" />
  <circle cx="80" cy="50" r="7" fill="#FFC299" stroke="#0F172A" stroke-width="5" />
  
  <!-- Cabeza base (Mismo tono de piel para mantener coherencia) -->
  <rect x="20" y="15" width="60" height="60" rx="25" fill="#FFC299" stroke="#0F172A" stroke-width="5" />

  <!-- Pelo blanco (Peinado clásico hacia atrás con entradas) -->
  <path d="M 16 45 C 16 -5, 84 -5, 84 45 C 75 25, 65 22, 50 25 C 35 22, 25 25, 16 45 Z" fill="#F3F4F6" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- Arrugas en la frente (Estrés directivo) -->
  <path d="M 35 28 Q 50 31 65 28" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 40 21 Q 50 24 60 21" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

  <!-- Cejas pobladas blancas (Fruncidas y severas) -->
  <path d="M 24 35 L 42 41 L 41 45 L 23 39 Z" fill="#F3F4F6" stroke="#0F172A" stroke-width="4" stroke-linejoin="round" />
  <path d="M 76 35 L 58 41 L 59 45 L 77 39 Z" fill="#F3F4F6" stroke="#0F172A" stroke-width="4" stroke-linejoin="round" />

  <!-- Ojos (Mirada cansada y exigente) -->
  <circle cx="34" cy="48" r="3.5" fill="#0F172A" />
  <circle cx="66" cy="48" r="3.5" fill="#0F172A" />
  
  <!-- Ojeras (Bolsas bajo los ojos) -->
  <path d="M 28 54 Q 34 58 40 54" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M 72 54 Q 66 58 60 54" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" opacity="0.7" />

  <!-- Gran Bigote blanco (Estilo Morsa/Ejecutivo clásico) -->
  <path d="M 26 65 Q 50 56 74 65 Q 65 75 50 71 Q 35 75 26 65 Z" fill="#F3F4F6" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  
</svg>