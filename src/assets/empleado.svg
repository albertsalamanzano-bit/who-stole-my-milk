<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  
  <!-- Ropa: Sudadera (Hoodie) Mostaza (Contraste con los trajes formales) -->
  <path d="M 10 100 C 10 65, 90 65, 90 100" fill="#F59E0B" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Camiseta interior blanca -->
  <path d="M 35 65 L 50 85 L 65 65 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Cuello de la sudadera -->
  <path d="M 25 65 Q 50 85 75 65" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round" />
  
  <!-- Cordones de la sudadera -->
  <path d="M 35 75 Q 38 90 33 95" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
  <path d="M 65 75 Q 62 90 67 95" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />

  <!-- Oreja Izquierda (La derecha la tapará el auricular) -->
  <circle cx="20" cy="50" r="7" fill="#B46B42" stroke="#0F172A" stroke-width="5" />
  
  <!-- Cabeza base (Tono de piel moreno) -->
  <rect x="20" y="15" width="60" height="60" rx="25" fill="#B46B42" stroke="#0F172A" stroke-width="5" />

  <!-- Pelo (Textura superior moderna y con volumen) -->
  <path d="M 16 38 C 16 0, 84 0, 84 38 C 78 28, 65 24, 50 30 C 35 24, 22 28, 16 38 Z" fill="#271811" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- Barba (Bordea la mandíbula inferior, diseño ultra limpio sin emborronar la cara) -->
  <path d="M 20 48 L 20 50 A 25 25 0 0 0 45 75 L 55 75 A 25 25 0 0 0 80 50 L 80 48 Q 65 65 50 65 Q 35 65 20 48 Z" fill="#271811" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- Bigote amigable y desconectado -->
  <path d="M 35 55 Q 50 48 65 55 Q 50 58 35 55 Z" fill="#271811" stroke="#0F172A" stroke-width="4" stroke-linejoin="round" />

  <!-- Boca sonriente y cercana -->
  <path d="M 42 58 Q 50 68 58 58 Z" fill="#EF4444" stroke="#0F172A" stroke-width="4" stroke-linejoin="round" />

  <!-- Ojos (Mirada amable y relajada) -->
  <circle cx="34" cy="44" r="4.5" fill="#0F172A" />
  <circle cx="66" cy="44" r="4.5" fill="#0F172A" />
  
  <!-- Cejas rectas y relajadas -->
  <path d="M 28 36 L 40 36" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 72 36 L 60 36" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />

  <!-- Diadema de los auriculares corporativos -->
  <path d="M 15 50 C 15 -5, 85 -5, 85 50" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />
  
  <!-- Auricular Derecho -->
  <rect x="73" y="38" width="14" height="26" rx="6" fill="#475569" stroke="#0F172A" stroke-width="4" />
  <rect x="76" y="42" width="6" height="18" rx="3" fill="#94A3B8" />

  <!-- Auricular Izquierdo -->
  <rect x="13" y="38" width="14" height="26" rx="6" fill="#475569" stroke="#0F172A" stroke-width="4" />
  <rect x="18" y="42" width="6" height="18" rx="3" fill="#94A3B8" />

  <!-- Micrófono del auricular -->
  <path d="M 20 58 Q 20 70 35 65" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
  <circle cx="35" cy="65" r="4" fill="#64748B" stroke="#0F172A" stroke-width="2.5" />
  
</svg>