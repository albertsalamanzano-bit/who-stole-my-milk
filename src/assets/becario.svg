<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  
  <!-- Coletas rubias (Detrás del cuerpo y la cabeza) -->
  <path d="M 22 45 Q 0 65 10 85 Q 25 65 24 50 Z" fill="#FCD34D" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  <path d="M 78 45 Q 100 65 90 85 Q 75 65 76 50 Z" fill="#FCD34D" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- Suéter verde llamativo -->
  <path d="M 15 100 C 15 65, 85 65, 85 100" fill="#4ADE80" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Cuello de camisa blanca debajo -->
  <path d="M 35 75 L 50 90 L 65 75 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Cinta del pase de identificación (Lanyard) -->
  <path d="M 35 75 L 50 95 L 65 75" fill="none" stroke="#F472B6" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Tarjeta de identificación -->
  <rect x="42" y="90" width="16" height="20" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="4.5" stroke-linejoin="round" />
  <line x1="46" y1="96" x2="54" y2="96" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <line x1="47" y1="102" x2="53" y2="102" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />

  <!-- Orejas -->
  <circle cx="20" cy="50" r="7" fill="#FFC299" stroke="#0F172A" stroke-width="5" />
  <circle cx="80" cy="50" r="7" fill="#FFC299" stroke="#0F172A" stroke-width="5" />
  
  <!-- Cabeza base -->
  <rect x="20" y="15" width="60" height="60" rx="25" fill="#FFC299" stroke="#0F172A" stroke-width="5" />
  
  <!-- Mejillas sonrosadas (Entusiasmo de becaria) -->
  <circle cx="28" cy="58" r="5" fill="#F87171" opacity="0.6" />
  <circle cx="72" cy="58" r="5" fill="#F87171" opacity="0.6" />

  <!-- Boca (Abierta y sonriente) -->
  <path d="M 43 62 Q 50 74 57 62 Z" fill="#EF4444" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- Ojos (Puntos grandes y expresivos) -->
  <circle cx="34" cy="50" r="4.5" fill="#0F172A" />
  <circle cx="66" cy="50" r="4.5" fill="#0F172A" />
  
  <!-- Pestañas laterales -->
  <path d="M 28 47 Q 31 43 34 46" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
  <path d="M 72 47 Q 69 43 66 46" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />

  <!-- Flequillo rubio grueso -->
  <path d="M 18 40 C 18 5, 82 5, 82 40 C 70 25, 55 25, 50 35 C 45 25, 30 25, 18 40 Z" fill="#FCD34D" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Cejas (Dibujadas por encima del flequillo para enfatizar expresión) -->
  <path d="M 28 38 Q 34 34 38 38" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 72 38 Q 66 34 62 38" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />

</svg>
