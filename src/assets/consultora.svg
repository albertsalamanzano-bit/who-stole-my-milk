<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  
  <!-- Ropa: Americana (Blazer) color crema -->
  <path d="M 15 100 C 15 65, 85 65, 85 100" fill="#E5E7EB" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Ropa: Base del cuello alto negro (Turtleneck) detrás de la cabeza -->
  <rect x="35" y="50" width="30" height="25" fill="#1F2937" stroke="#0F172A" stroke-width="5" />
  
  <!-- Ropa: Escote en V de la americana mostrando el suéter negro -->
  <path d="M 35 65 L 50 95 L 65 65 Z" fill="#1F2937" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- Pelo trasero / lateral izquierdo (Cae detrás de los hombros) -->
  <path d="M 15 40 L 12 70 Q 15 80 25 75 L 25 40 Z" fill="#B91C1C" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- Oreja derecha (Tapada parcialmente por el pelo derecho) -->
  <circle cx="80" cy="50" r="7" fill="#C27A59" stroke="#0F172A" stroke-width="5" />

  <!-- Pelo lateral derecho (Corte Bob, cubre la oreja derecha) -->
  <path d="M 85 40 L 88 75 Q 75 85 73 70 L 75 40 Z" fill="#B91C1C" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- Cabeza base (Piel oscura media) -->
  <rect x="20" y="15" width="60" height="60" rx="25" fill="#C27A59" stroke="#0F172A" stroke-width="5" />

  <!-- Oreja izquierda (Dibujada por encima del pelo izquierdo, asoma desafiante) -->
  <circle cx="20" cy="50" r="7" fill="#C27A59" stroke="#0F172A" stroke-width="5" />
  
  <!-- Pendiente de aro dorado en la oreja izquierda -->
  <circle cx="18" cy="55" r="4.5" fill="none" stroke="#FBBF24" stroke-width="3" />

  <!-- Flequillo pelirrojo (Cubre la frente y se integra con los laterales) -->
  <path d="M 14 42 C 14 -5, 86 -5, 86 42 Q 60 30 50 35 Q 30 30 14 42 Z" fill="#B91C1C" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />

  <!-- Cejas (Arqueadas, proyectan seguridad y superioridad) -->
  <path d="M 28 40 Q 33 36 38 39" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 72 40 Q 67 36 62 39" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />

  <!-- Ojos (Base redonda) -->
  <circle cx="34" cy="50" r="4.5" fill="#0F172A" />
  <circle cx="66" cy="50" r="4.5" fill="#0F172A" />
  
  <!-- Eyeliner / Párpados (Mirada rasgada y calculadora) -->
  <path d="M 27 47 Q 34 44 40 48" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 73 47 Q 66 44 60 48" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" />

  <!-- Boca (Sonrisa ladeada / Smirk de "yo lo sé todo") -->
  <path d="M 44 65 Q 52 68 56 61" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />

  <!-- Lunar (Beauty mark bajo el ojo) -->
  <circle cx="32" cy="62" r="1.5" fill="#0F172A" />

</svg>